plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.example.notificationhistory'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.notificationhistory"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.0.1"
    }

    signingConfigs {
        release {
            // 从 CI 注入的环境变量读取固定发布签名，保证所有版本签名证书一致，
            // 用户可稳定覆盖安装与升级（配置方法见 SIGNING.md）。
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath != null) {
                // KEYSTORE_PATH 相对路径以仓库根目录为基准（CI 传的是 app/release.keystore）
                def ksFile = new File(ksPath)
                if (!ksFile.isAbsolute()) {
                    ksFile = new File(rootDir, ksPath)
                }
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('KEY_ALIAS') ?: ''
                keyPassword System.getenv('KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            // 仅在提供签名文件时启用固定签名；本地无 KEYSTORE_PATH 时使用默认
            // debug 签名，不影响本地构建（正式发布一律走 CI，见 SIGNING.md）
            if (System.getenv('KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // CI 提供签名环境（KEYSTORE_PATH）时，debug 包同样使用固定签名，
            // 与 release 包同证书，保证 debug → release 可覆盖升级
            if (System.getenv('KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Activity KTX for ComponentActivity
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
