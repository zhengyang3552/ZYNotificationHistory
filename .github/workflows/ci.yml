name: CI

# 统一 Android CI 规范（与 ZYEmail / RemoteFileManager 同构）：
#   push main / v* 标签 / PR / 手动触发；质量门(build) -> lint -> release 三段。
# Release 签名改为从 GitHub Secrets 注入（仓库 Secrets 配置 KEYSTORE_BASE64 /
# KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），不再依赖本地 keystore 文件；
# 未配置 Secret 时自动产出 unsigned 包，仅验证 release 构建可通过。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  # ------------------------------------------------------- 单测 + Debug 构建
  build:
    name: 测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- Lint
  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 运行 Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: 汇总 Lint 结果
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------- Release（仅 v* 标签触发）
  release:
    name: 发布 Release APK
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # build.gradle 的 signingConfigs 从 KEYSTORE_PATH 等环境变量读取。
      # 已配置 KEYSTORE_BASE64 Secret 时解码为 keystore（签名包）；
      # 未配置时跳过，产物为 unsigned 包（仅验证 release 构建可通过）。
      - name: 还原签名 keystore（如已配置 Secret）
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          echo "KEYSTORE_PATH=app/release.keystore" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 重命名 APK（带版本号）
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist/ZYNotificationHistory-${GITHUB_REF_NAME}-release.apk"
          done
          ls -lh dist/

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
