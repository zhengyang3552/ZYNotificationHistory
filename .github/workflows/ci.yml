name: CI

# 统一 Android CI 规范（与 ZYEmail / RemoteFileManager 同构）：
#   push main / v* 标签 / PR / 手动触发；质量门(build) -> lint -> release 三段。
# Release 签名优先从 GitHub Secrets 注入（KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD），不再依赖本地 keystore 文件；未配置 Secret 时
# 自动生成临时 keystore 完成构建（产物可验证构建但不可上架）。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  # ------------------------------------------------------- 单测 + Debug 构建
  build:
    name: 测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- Lint
  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 运行 Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: 汇总 Lint 结果
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYNotificationHistory-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------- Release（仅 v* 标签触发）
  release:
    name: 发布 Release APK
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # build.gradle 的 signingConfigs 无条件读取 KEYSTORE_PATH 等环境变量，
      # 且 secrets 上下文不能用于 if 条件，所以这里不用 if 分支，而是在脚本内判断：
      # 已配置 KEYSTORE_BASE64 Secret -> 解码正式 keystore；
      # 未配置 -> keytool 现场生成临时 keystore，保证 assembleRelease 一定能过
      # （临时签名的包仅验证可构建，不可上架，日志会有 warning 提示）。
      - name: 准备签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "使用 Secret 中的正式 keystore"
          else
            keytool -genkeypair -v -keystore app/release.keystore \
              -storepass zy-ci-temp-2026 -keypass zy-ci-temp-2026 \
              -alias zy-ci-temp -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=ZY CI Temporary" > /dev/null 2>&1
            echo "KEYSTORE_PASSWORD=zy-ci-temp-2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=zy-ci-temp" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=zy-ci-temp-2026" >> "$GITHUB_ENV"
            echo "::warning::未配置 KEYSTORE_BASE64 等 Secret，本次 Release 使用临时 keystore 签名，不可用于上架"
          fi
          echo "KEYSTORE_PATH=app/release.keystore" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 重命名 APK（带版本号）
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist/ZYNotificationHistory-${GITHUB_REF_NAME}-release.apk"
          done
          ls -lh dist/

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
