name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的构建，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      # ubuntu-latest 已预装 Android SDK 与 cmdline-tools，只需补齐编译所需的 platform 与 build-tools。
      # 不再使用 android-actions/setup-android，它内部会执行 `sdkmanager tools`，
      # 而 Google 已下线该包，会导致整条流水线在 SDK 安装阶段失败。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKM" ]; then
            echo "未找到 sdkmanager，SDK 目录内容："
            ls -R "$SDK_ROOT" | head -50
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK_ROOT" --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # 缓存 Gradle Wrapper 与依赖，二次构建通常 3 分钟内完成
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
            echo "由 secret KEYSTORE_BASE64 还原签名文件"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -f app/release.keystore ]; then
            echo "使用仓库内置 app/release.keystore（建议后续改为 secret）"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "没有可用签名文件，本次跳过 Release 构建"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Run lint
        run: ./gradlew --stacktrace lintDebug

      - name: Build signed release APK
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zy-notification-history' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # PR 事件的 ref_name 是 "16/merge" 这类含 / 的值，artifact 名不允许斜杠，改用编号
          name: apk-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "| 项目 | 结果 |"
            echo "| --- | --- |"
            echo "| Debug APK | ${{ job.status }} |"
            echo "| Release APK | ${{ steps.keystore.outputs.available == 'true' && job.status || '跳过（无签名文件）' }} |"
            echo ""
            echo "产物见本次运行页面的 **Artifacts** 区域。"
          } >> "$GITHUB_STEP_SUMMARY"
